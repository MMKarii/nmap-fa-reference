name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache MkDocs
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-${{ runner.os }}-

      - name: Install documentation dependencies
        run: pip install -r requirements.txt

      - name: Test documentation integrity checker
        run: python -m unittest scripts.test_check_docs

      - name: Check bilingual structure and local links
        run: python scripts/check_docs.py

      - name: Build Persian documentation
        run: mkdocs build --strict -f mkdocs.fa.yml -d site/fa

      - name: Build English documentation
        run: mkdocs build --strict -f mkdocs.en.yml -d site/en

      - name: Add bilingual root landing page
        run: cp site-root/index.html site/index.html

      - name: Verify bilingual output
        run: |
          test -f site/index.html
          test -f site/fa/index.html
          test -f site/en/index.html
          test -f site/fa/14-common-mistakes/index.html
          test -f site/en/14-common-mistakes/index.html
          test -f site/fa/assets/brand-banner.webp
          test -f site/en/assets/brand-banner.webp

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
