name: release-v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create v2.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "v2.0.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v2.0.0 \
            --target "$GITHUB_SHA" \
            --title "v2.0.0 - Bilingual Edition" \
            --notes-file .github/release-notes/v2.0.0.md
