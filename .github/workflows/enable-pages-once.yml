name: enable-pages-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-pages-once.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/pages-create.json"
          code="$(curl -sS -L             -o "$response"             -w "%{http_code}"             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"             -d '{"source":{"branch":"gh-pages","path":"/"}}')"
          cat "$response"
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "Unexpected Pages API status: $code" >&2
            exit 1
          fi

      - name: Verify Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"             | tee "$RUNNER_TEMP/pages.json"
          grep -q '"html_url"' "$RUNNER_TEMP/pages.json"
          grep -q '"branch": "gh-pages"' "$RUNNER_TEMP/pages.json"
