name: Banner transfer diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/banner-transfer-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect download page bundle
        env:
          SHARE_URL: https://firestorage.ai/ja/f/lt5TlIrU285b
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.request
          from urllib.parse import urljoin

          headers={'User-Agent':'Mozilla/5.0'}
          share=os.environ['SHARE_URL']
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read(), r.geturl(), r.headers.get('content-type','')

          body,final,_=get(share)
          html=body.decode('utf-8','ignore')
          scripts=re.findall(r'''<script[^>]+src=["']([^"']+)["']''',html,re.I)
          print('SCRIPT_COUNT',len(scripts))
          for src in scripts:
              url=urljoin(final,src)
              if '/app/(files)/' not in url and '/chunks/' not in url:
                  continue
              try:
                  data,jsurl,_=get(url)
              except Exception as e:
                  print('FETCH_FAIL',url,e)
                  continue
              text=data.decode('utf-8','ignore')
              hits=[]
              patterns=[
                r'''https?://[^"'`\\s]+''',
                r'''["'`]([^"'`]{0,120}(?:download|share|public|file|object|signed|presign|api)[^"'`]{0,180})["'`]''',
                r'''fetch\(([^)]{1,300})\)'''
              ]
              for pat in patterns:
                  for m in re.findall(pat,text,re.I):
                      s=m if isinstance(m,str) else ''.join(m)
                      if any(k in s.lower() for k in ('download','share','public','file','object','signed','presign','api')):
                          hits.append(s)
              if hits:
                  print('--- BUNDLE',jsurl,'SIZE',len(data),'---')
                  seen=set()
                  for h in hits:
                      h=h.replace('\\/','/')
                      if h in seen: continue
                      seen.add(h)
                      print(h[:800])
                      if len(seen)>=120: break
          PY
