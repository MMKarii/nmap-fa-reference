name: Banner transfer diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/banner-transfer-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Firestorage download calls
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request

          headers={'User-Agent':'Mozilla/5.0'}
          urls=[
            'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js',
            'https://firestorage.ai/_next/static/chunks/5841-1160578ba9bb4f3e.js',
          ]
          needles=['/shares/','shareEndpoint','download','api.firestorage.ai/prod/file/','presign','signed','fileId']
          for url in urls:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  text=r.read().decode('utf-8','ignore')
              print('\n===== URL',url,'LEN',len(text),'=====')
              for needle in needles:
                  start=0
                  count=0
                  while True:
                      pos=text.find(needle,start)
                      if pos<0 or count>=12: break
                      print('\n--- NEEDLE',needle,'POS',pos,'---')
                      print(text[max(0,pos-1800):pos+3200])
                      start=pos+len(needle)
                      count+=1
          PY
