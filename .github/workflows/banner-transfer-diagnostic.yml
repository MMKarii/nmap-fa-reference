name: Install high-quality README banner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/banner-transfer-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download original-quality banner
        env:
          SHARE_ID: lt5TlIrU285b
          EXPECTED_NAME: banner-1600-q90.webp
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request

          base = 'https://api.firestorage.ai/prod/file'
          share_id = os.environ['SHARE_ID']
          expected = os.environ['EXPECTED_NAME']
          headers = {'User-Agent': 'Mozilla/5.0'}

          def request_json(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          listing = request_json(f'{base}/shares/{share_id}/files?maxResults=1000')
          files = listing.get('files') or []
          selected = next((f for f in files if f.get('fileName') == expected), None)
          if not selected:
              raise SystemExit(f'Expected file not found. Available: {[f.get("fileName") for f in files]}')

          file_id = selected['fileId']
          ticket = request_json(f'{base}/shares/{share_id}/files/{file_id}/download', method='POST')
          download_url = ticket['downloadUrl']

          out = pathlib.Path('docs/assets/brand-banner.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request(download_url, headers=headers)
          with urllib.request.urlopen(req, timeout=120) as r:
              data = r.read()
          out.write_bytes(data)

          if len(data) < 100_000:
              raise SystemExit(f'Banner unexpectedly small: {len(data)} bytes')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Downloaded file is not a valid WebP')
          print(f'Installed {out}: {len(data)} bytes')
          PY

      - name: Point README to high-quality banner
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = 'docs/assets/brand-banner.jpg'
          new = 'docs/assets/brand-banner.webp'
          if old not in text and new not in text:
              raise SystemExit('README banner reference not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify banner and commit
        run: |
          set -euo pipefail
          test -s docs/assets/brand-banner.webp
          grep -q 'docs/assets/brand-banner.webp' README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/assets/brand-banner.webp
          if git diff --cached --quiet; then
            echo 'No banner changes to commit.'
          else
            git commit -m 'docs: upgrade README banner quality'
            git push origin HEAD:main
          fi
