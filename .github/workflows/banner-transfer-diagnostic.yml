name: Banner transfer diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/banner-transfer-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect temporary share page
        env:
          SHARE_URL: https://firestorage.ai/ja/f/lt5TlIrU285b
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.request
          from urllib.parse import urljoin

          url = os.environ['SHARE_URL']
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read()
              final_url = r.geturl()
              ctype = r.headers.get('content-type','')
          print('FINAL_URL', final_url)
          print('CONTENT_TYPE', ctype)
          print('SIZE', len(body))
          text = body.decode('utf-8','ignore')
          print('--- candidate links ---')
          vals = []
          vals += re.findall(r'''(?:href|src)=["']([^"']+)["']''', text, flags=re.I)
          vals += re.findall(r'''https?://[^"'<>\\s]+''', text, flags=re.I)
          vals += [x.replace('\\/','/') for x in re.findall(r'''https?:\\/\\/[^"'<>\\s]+''', text, flags=re.I)]
          seen = set()
          for v in vals:
              full = urljoin(final_url, v)
              if full in seen:
                  continue
              seen.add(full)
              low = full.lower()
              if any(k in low for k in ('download','file','storage','webp','api','share')):
                  print(full[:1000])
          print('--- html markers ---')
          for key in ('download','webp','file_id','fileId','publicId','shareId','subdir','api/'):
              print(key, text.lower().find(key.lower()))
          for key in ('download','webp','fileId','shareId'):
              pos=text.lower().find(key.lower())
              if pos >= 0:
                  print('CONTEXT', key, text[max(0,pos-400):pos+800].replace('\n',' ')[:1200])
          PY
