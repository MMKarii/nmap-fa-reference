site_name: مرجع حرفه‌ای Nmap به زبان فارسی
site_description: مرجع فارسی Nmap برای یادگیری، مراجعه سریع و ارزیابی امنیتی مجاز
site_url: https://mmkarii.github.io/nmap-fa-reference/
repo_url: https://github.com/MMKarii/nmap-fa-reference
repo_name: MMKarii/nmap-fa-reference
edit_uri: edit/main/docs/

copyright: "Persian Nmap Reference · Use only in authorized environments"

theme:
  name: material
  language: fa
  direction: rtl
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: حالت تاریک
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: حالت روشن
  icon:
    logo: material/radar
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MMKarii/nmap-fa-reference
      name: GitHub Repository

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - شروع:
      - خانه: index.md
      - مسیر یادگیری: learning-path.md
      - Cheat Sheet: cheatsheet.md
      - منابع رسمی: references.md
  - مبانی:
      - "۱. معرفی بنیادین Nmap": 01-introduction.md
      - "۲. Syntax و ساختار دستورات": 02-syntax.md
      - "۳. Host Discovery": 03-host-discovery.md
      - "۴. Port Specification": 04-port-specification.md
      - "۵. Scan Types": 05-scan-types.md
  - شناسایی:
      - "۶. Service & Version Detection": 06-service-version-detection.md
      - "۷. OS Detection": 07-os-detection.md
      - "۸. NSE": 08-nse.md
  - کنترل و گزارش:
      - "۹. Firewall / IDS / IPS": 09-firewall-ids-ips-evasion.md
      - "۱۰. Timing & Performance": 10-timing-performance.md
      - "۱۱. Output & Reporting": 11-output-reporting.md
  - کاربرد عملی:
      - "۱۲. سناریوهای عملی": 12-practical-scenarios.md
      - "۱۳. تحلیل خروجی‌ها": 13-output-analysis.md
      - "۱۴. اشتباهات رایج": 14-common-mistakes.md
  - سلب مسئولیت: disclaimer.md
