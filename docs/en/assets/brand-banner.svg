<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Nmap Persian Reference</title>
  <desc id="desc">Professional banner for the Persian Nmap reference documentation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#0b2941"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="45%" r="55%">
      <stop offset="0" stop-color="#29d3ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#29d3ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="500" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="500" rx="34" fill="url(#grid)"/>
  <rect width="1600" height="500" rx="34" fill="url(#glow)"/>

  <g opacity="0.75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#7dd3fc">
    <text x="70" y="95">$ nmap -sV --top-ports 100 target</text>
    <text x="70" y="135" fill="#94a3b8">PORT      STATE      SERVICE</text>
    <text x="70" y="175">22/tcp    open       ssh</text>
    <text x="70" y="210">80/tcp    open       http</text>
    <text x="70" y="245">443/tcp   open       https</text>
  </g>

  <g transform="translate(1210 110)" stroke="#38bdf8" fill="none" filter="url(#softGlow)">
    <circle cx="95" cy="95" r="88" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="95" cy="95" r="55" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="95" cy="95" r="18" fill="#38bdf8" fill-opacity="0.8" stroke="none"/>
    <path d="M95 7V183M7 95H183" stroke-opacity="0.2"/>
    <path d="M95 95L166 49" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g stroke="#22d3ee" stroke-width="2" opacity="0.55">
    <path d="M1030 350L1120 308L1200 365L1300 315L1408 365" fill="none"/>
    <circle cx="1030" cy="350" r="7" fill="#22d3ee"/>
    <circle cx="1120" cy="308" r="7" fill="#22d3ee"/>
    <circle cx="1200" cy="365" r="7" fill="#22d3ee"/>
    <circle cx="1300" cy="315" r="7" fill="#22d3ee"/>
    <circle cx="1408" cy="365" r="7" fill="#22d3ee"/>
  </g>

  <g text-anchor="middle">
    <text x="800" y="205" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="72" letter-spacing="3" fill="#f8fafc">NMAP FA REFERENCE</text>
    <text x="800" y="272" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma, Arial, sans-serif" font-weight="700" font-size="42" fill="#e2e8f0">مرجع حرفه‌ای فارسی Nmap برای امنیت شبکه</text>
    <text x="800" y="325" font-family="Inter, Arial, sans-serif" font-size="22" letter-spacing="4" fill="#67e8f9">LEARN  ·  VERIFY  ·  DOCUMENT</text>
  </g>

  <rect x="575" y="382" width="450" height="48" rx="24" fill="#0f3550" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="800" y="414" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">Official-reference aligned · RTL Docs · MkDocs Material</text>
</svg>